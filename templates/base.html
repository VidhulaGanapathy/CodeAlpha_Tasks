{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniSocial</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'sunset');
  </script>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="brand">✨ MiniSocial</a>
    <div class="nav-links">
      <select id="theme-select" title="Change theme">
        <option value="sunset">🌅 Sunset</option>
        <option value="ocean">🌊 Ocean</option>
        <option value="forest">🌿 Forest</option>
        <option value="midnight">🌙 Midnight</option>
      </select>
      {% if user.is_authenticated %}
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'profile' user.username %}">👤 My Profile</a>
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}
          <button>Logout</button>
        </form>
      {% endif %}
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script src="{% static 'script.js' %}"></script>
</body>
</html>
